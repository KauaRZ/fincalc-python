
name: FinCalc CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # JOB 1: INTEGRACAO CONTINUA (CI)
  build-and-lint:
    name: Build, Static Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar Sintaxe
        run: |
          python -m py_compile fincalc.py
          python -m py_compile tests/test_*.py

      - name: Executar Flake8
        run: flake8 fincalc.py tests/

      - name: Executar Bandit
        run: bandit -r fincalc.py

      - name: Executar Testes e Cobertura
        run: |
          python -m pytest tests/ -v --cov=fincalc --cov-report=term-missing --cov-report=html:coverage_report

      - name: Publicar Relatório de Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: coverage_report/
          if-no-files-found: ignore

  # JOB 2: ENTREGA CONTINUA (CD SIMULADO)
  deploy-simulado-codespaces:
    name: CD - Deploy Simulado
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Simular Implantação
        run: |
          echo "Iniciando deploy automatico..."
          mkdir -p /tmp/servidor_producao_fincalc
          cp -r *.py /tmp/servidor_producao_fincalc/
          echo "Arquivos copiados para o servidor simulado."

      - name: Teste Final
        run: |
          python3 -m py_compile /tmp/servidor_producao_fincalc/fincalc.py
          echo "DEPLOY CONCLUIDO COM SUCESSO!"
